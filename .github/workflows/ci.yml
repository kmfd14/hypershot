name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            install_target: false
          - target: aarch64-unknown-linux-gnu
            install_target: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI / portal build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxss-dev libglib2.0-dev pkg-config
      - name: Install aarch64 cross linker
        if: matrix.install_target
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Test (host)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked
      - name: Check (cross aarch64)
        if: matrix.install_target
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked --target aarch64-unknown-linux-gnu

  macos:
    name: macOS (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Check x86_64 Darwin (optional cross)
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            host: true
          - target: aarch64-pc-windows-msvc
            host: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test (x64 host)
        if: matrix.host
        run: cargo test --locked
      - name: Check (aarch64-pc-windows-msvc)
        if: ${{ !matrix.host }}
        run: cargo check --locked --target aarch64-pc-windows-msvc
