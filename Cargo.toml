[package]
name = "hypershot"
version = "1.16.0"
edition = "2024"
description = "HyperShot — cross-platform screenshot tool with annotation"
license = "MIT"
repository = "https://github.com/kmfd14/hypershot"
readme = "README.md"
keywords = ["screenshot", "annotation", "capture", "cross-platform"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "hypershot"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.105"
arboard = { version = "3", features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
eframe = "0.31"
egui = "0.31"
image = "0.25"
imageproc = "0.25"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.8"
url = "2.5.9"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", features = ["screenshot", "tokio"] }
ksni = "0.3"
