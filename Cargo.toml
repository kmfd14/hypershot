[package]
name = "lightsnip"
version = "0.7.0"
edition = "2024"
description = "HyperShot — cross-platform screenshot tool with annotation (binary: lightsnip)"
license = "MIT"
repository = "https://github.com/kmfd14/lightsnip"
readme = "README.md"
keywords = ["screenshot", "wayland", "portal", "annotation", "cross-platform"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1.0.105"
arboard = { version = "3", features = ["image-data"] }
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
eframe = "0.31"
egui = "0.31"
image = "0.25"
imageproc = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.8"
url = "2.5.9"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", features = ["screenshot", "tokio"] }
ksni = "0.3"
