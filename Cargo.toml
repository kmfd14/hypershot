[package]
name = "hypershot"
version = "1.22.0"
edition = "2024"
description = "HyperShot — cross-platform screenshot tool with annotation"
license = "MIT"
authors = ["KM Decena <kmfd14@gmail.com>"]
repository = "https://github.com/kmfd14/hypershot"
homepage = "https://github.com/kmfd14/hypershot"
readme = "README.md"
keywords = ["screenshot", "annotation", "capture", "cross-platform"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "hypershot"
path = "src/main.rs"

# cargo-packager: deb / AppImage (Linux), app / dmg (macOS). No RPM format.
# Docs: https://docs.crabnebula.dev/packager/configuration/
[package.metadata.packager]
product-name = "HyperShot"
identifier = "com.kmfd14.hypershot"
authors = ["KM Decena"]
license-file = "LICENSE"
copyright = "Copyright (c) KM Decena"
category = "Photography"
homepage = "https://github.com/kmfd14/hypershot"
icons = [
  "assets/packaging/hypershot-32.png",
  "assets/packaging/hypershot-64.png",
  "assets/packaging/hypershot-128.png",
  "assets/packaging/hypershot-256.png",
  "assets/packaging/hypershot-512.png",
]
out-dir = "target/packager"
formats = ["deb", "appimage"]

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
section = "graphics"
priority = "optional"
depends = [
  "libxkbcommon0",
  "libwayland-client0",
  "libx11-6",
  "libxi6",
  "libxcursor1",
  "libxrandr2",
  "libglib2.0-0",
]
desktop-template = "assets/packaging/hypershot.desktop.hbs"
files = { "assets/packaging/hypershot-256.png" = "/usr/share/icons/hicolor/256x256/apps/hypershot.png", "assets/packaging/hypershot-128.png" = "/usr/share/icons/hicolor/128x128/apps/hypershot.png", "assets/packaging/hypershot-64.png" = "/usr/share/icons/hicolor/64x64/apps/hypershot.png", "assets/packaging/hypershot-32.png" = "/usr/share/icons/hicolor/32x32/apps/hypershot.png" }

[package.metadata.packager.dmg]

# cargo-deb (alternative local path for deb)
[package.metadata.deb]
name = "hypershot"
section = "graphics"
priority = "optional"
maintainer = "KM Decena <kmfd14@gmail.com>"
depends = "$auto"
assets = [
  ["target/release/hypershot", "usr/bin/", "755"],
  ["assets/packaging/hypershot.desktop", "usr/share/applications/", "644"],
  ["assets/packaging/hypershot-256.png", "usr/share/icons/hicolor/256x256/apps/hypershot.png", "644"],
  ["assets/packaging/hypershot-128.png", "usr/share/icons/hicolor/128x128/apps/hypershot.png", "644"],
  ["assets/packaging/hypershot-64.png", "usr/share/icons/hicolor/64x64/apps/hypershot.png", "644"],
  ["assets/packaging/hypershot-32.png", "usr/share/icons/hicolor/32x32/apps/hypershot.png", "644"],
  ["README.md", "usr/share/doc/hypershot/", "644"],
  ["LICENSE", "usr/share/doc/hypershot/", "644"],
]

# cargo-generate-rpm (cargo-packager has no RPM format)
[package.metadata.generate-rpm]
name = "hypershot"
license = "MIT"
summary = "HyperShot — screenshot tool with annotation"
url = "https://github.com/kmfd14/hypershot"
assets = [
  { source = "target/release/hypershot", dest = "/usr/bin/hypershot", mode = "755" },
  { source = "assets/packaging/hypershot.desktop", dest = "/usr/share/applications/hypershot.desktop", mode = "644" },
  { source = "assets/packaging/hypershot-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/hypershot.png", mode = "644" },
  { source = "assets/packaging/hypershot-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/hypershot.png", mode = "644" },
  { source = "assets/packaging/hypershot-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/hypershot.png", mode = "644" },
  { source = "assets/packaging/hypershot-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/hypershot.png", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/hypershot/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/hypershot/LICENSE", mode = "644", doc = true },
]

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.105"
arboard = { version = "3", features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
eframe = "0.31"
egui = "0.31"
image = "0.25"
imageproc = "0.25"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.8"
url = "2.5.9"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", features = ["screenshot", "tokio"] }
ksni = "0.3"
